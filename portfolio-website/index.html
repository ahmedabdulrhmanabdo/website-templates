<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>أحمد | معرض أعمال</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="header"><div class="container nav">
  <a class="logo" href="#top">أحمد<span>.</span></a>
  <nav><a href="#work">أعمالي</a><a href="#skills">مهاراتي</a><a href="#contact">تواصل</a>
  <button id="theme" aria-label="تبديل الوضع">🌓</button></nav>
</div></header>
<main id="top">
<section class="hero"><div class="container">
  <p class="hi">مرحبًا، أنا</p>
  <h1>أحمد، <em>مطوّر ومصمّم</em> مواقع</h1>
  <p class="lead">أحوّل الأفكار إلى واجهات جميلة وسريعة، وأبني أنظمة تخدم الأعمال.</p>
  <a href="#work" class="btn">شاهد أعمالي</a> <a href="#contact" class="btn ghost">تواصل معي</a>
</div></section>

<section class="section" id="work"><div class="container">
  <h2>أعمالي</h2>
  <div class="filters">
    <button class="f active" data-c="all">الكل</button><button class="f" data-c="web">مواقع</button>
    <button class="f" data-c="app">أنظمة</button><button class="f" data-c="brand">هويات</button>
  </div>
  <div class="projects" id="projects"></div>
</div></section>

<section class="section alt" id="skills"><div class="container">
  <h2>مهاراتي</h2>
  <div class="skills" id="skills-list"></div>
</div></section>

<section class="section" id="contact"><div class="container narrow">
  <h2>لنعمل معًا</h2>
  <p class="center">لديك مشروع؟ راسلني وسأعود إليك سريعًا.</p>
  <form id="cf" novalidate>
    <input name="name" placeholder="الاسم" required>
    <input name="email" type="email" placeholder="البريد الإلكتروني" required>
    <textarea name="message" rows="4" placeholder="رسالتك" required></textarea>
    <button class="btn" type="submit">إرسال</button><p class="msg" role="status"></p>
  </form>
</div></section>
</main>
<footer class="footer">© <span id="year"></span> أحمد — قالب تجريبي</footer>
<script src="script.js"></script>
</body></html>
