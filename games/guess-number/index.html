<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>🔢 خمّن الرقم</title><style>*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
:root{--a:#7c3aed;--bg:#0f172a;--card:#1e293b;--ink:#f1f5f9;--mut:#94a3b8}
body{font-family:system-ui,'Segoe UI',Tahoma,Arial,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;display:grid;place-items:start center;padding:20px 12px;line-height:1.6}
.g{background:var(--card);border-radius:18px;padding:20px;width:min(440px,100%);text-align:center;box-shadow:0 12px 40px rgba(0,0,0,.4)}
h1{font-size:1.4rem;margin-bottom:8px}.mut{color:var(--mut)}.st{margin:8px 0 14px;font-weight:700;min-height:1.6em}
button{font:inherit;border:0;border-radius:10px;padding:10px 18px;background:var(--a);color:#fff;font-weight:700;cursor:pointer}
button:hover{filter:brightness(1.12)}input{font:inherit;padding:10px;border-radius:10px;border:1px solid #334155;background:#0f172a;color:var(--ink);text-align:center}
</style></head>
<body><div class="g"><h1>🔢 خمّن الرقم</h1>
<p class="mut">اخترت رقمًا بين 1 و100، لديك 7 محاولات</p><div id="st" class="st"></div><div style="display:flex;gap:8px;justify-content:center"><input id="v" type="number" min="1" max="100" placeholder="؟" style="width:110px"><button id="g">خمّن</button></div><p class="mut" id="h" style="margin:12px 0"></p><button id="r" style="background:#334155">لعبة جديدة</button>
</div><script>

const $=i=>document.getElementById(i);let n,left,hist,over;
function init(){n=1+Math.floor(Math.random()*100);left=7;hist=[];over=false;$('st').textContent='محاولات متبقية: 7';$('h').textContent='';$('v').value='';$('v').disabled=false}
function guess(){if(over)return;const v=+$('v').value;if(!v||v<1||v>100){$('st').textContent='أدخل رقمًا من 1 إلى 100';return}
 left--;hist.push(v);$('h').textContent='محاولاتك: '+hist.join(' ، ');$('v').value='';
 if(v===n){$('st').textContent=`🎉 صح! الرقم ${n} (في ${hist.length} محاولة)`;over=true}
 else if(left===0){$('st').textContent=`😢 انتهت المحاولات، الرقم كان ${n}`;over=true}
 else $('st').textContent=(v<n?'⬆️ أكبر':'⬇️ أصغر')+` — متبقي ${left}`}
$('g').onclick=guess;$('v').onkeydown=e=>{if(e.key==='Enter')guess()};$('r').onclick=init;init();
</script></body></html>
