<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><script>/*i18n*/try{if((localStorage.getItem("lang")||"en")!=="ar"){var h=document.documentElement;h.classList.add("i18n-pending");h.lang="en";h.dir="ltr";setTimeout(function(){h.classList.remove("i18n-pending")},2500)}}catch(e){}</script><style>.i18n-pending body{visibility:hidden}</style><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>⌨️ اختبار سرعة الكتابة</title><style>*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
:root{--a:#7c3aed;--bg:#0f172a;--card:#1e293b;--ink:#f1f5f9;--mut:#94a3b8}
body{font-family:system-ui,'Segoe UI',Tahoma,Arial,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;display:grid;place-items:start center;padding:20px 12px;line-height:1.6}
.g{background:var(--card);border-radius:18px;padding:20px;width:min(440px,100%);text-align:center;box-shadow:0 12px 40px rgba(0,0,0,.4)}
h1{font-size:1.4rem;margin-bottom:8px}.mut{color:var(--mut)}.st{margin:8px 0 14px;font-weight:700;min-height:1.6em}
button{font:inherit;border:0;border-radius:10px;padding:10px 18px;background:var(--a);color:#fff;font-weight:700;cursor:pointer}
button:hover{filter:brightness(1.12)}input{font:inherit;padding:10px;border-radius:10px;border:1px solid #334155;background:#0f172a;color:var(--ink);text-align:center}
.tx{font-size:1.5rem;line-height:2;background:#0f172a;border-radius:12px;padding:14px;text-align:right}.tx .ok{color:#4ade80}.tx .bad{color:#f87171;background:#7f1d1d55}</style></head>
<body><div class="g"><h1>⌨️ اختبار سرعة الكتابة</h1>
<p class="mut">اكتب الجملة بسرعة ودقة</p><div id="t" class="tx"></div><input id="i" style="width:100%;margin-top:10px" placeholder="ابدأ الكتابة هنا…" autocomplete="off"><div class="st" id="st" style="margin-top:12px">⏱️ 0 ثانية</div><button id="r">جملة جديدة</button><p class="mut" id="hi" style="margin-top:8px"></p>
</div><script>

const $=i=>document.getElementById(i);
const S=['العلم نور والجهل ظلام','من جد وجد ومن زرع حصد','الوقت كالسيف إن لم تقطعه قطعك','خير الكلام ما قل ودل','القناعة كنز لا يفنى','لا تؤجل عمل اليوم إلى الغد','الصبر مفتاح الفرج','في التأني السلامة وفي العجلة الندامة'];
let s,t0,tm,best=0;try{best=+localStorage.getItem('typ')||0}catch{}$('hi').textContent=best?'أفضل سرعة: '+best+' كلمة/دقيقة':'';
function init(){s=S[Math.floor(Math.random()*S.length)];t0=0;clearInterval(tm);$('i').value='';$('i').disabled=false;$('st').textContent='⏱️ 0 ثانية';render('')}
function render(v){$('t').innerHTML=[...s].map((c,k)=>`<span class="${k>=v.length?'':v[k]===c?'ok':'bad'}">${c}</span>`).join('')}
$('i').oninput=e=>{const v=e.target.value;if(!t0){t0=Date.now();tm=setInterval(()=>$('st').textContent='⏱️ '+Math.floor((Date.now()-t0)/1000)+' ثانية',200)}
 render(v);if(v.length>=s.length){clearInterval(tm);$('i').disabled=true;const mins=(Date.now()-t0)/60000,words=s.split(' ').length,acc=[...s].filter((c,k)=>v[k]===c).length/s.length;
  const wpm=Math.round(words/mins*acc);$('st').textContent=`🏁 ${wpm} كلمة/دقيقة — الدقة ${Math.round(acc*100)}%`;
  if(wpm>best){best=wpm;try{localStorage.setItem('typ',best)}catch{}$('hi').textContent='أفضل سرعة: '+best+' كلمة/دقيقة'}}};
$('r').onclick=init;init();
</script><script src="../i18n.js"></script></body></html>
