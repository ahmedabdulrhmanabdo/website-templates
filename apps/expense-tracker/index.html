<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head><script>/*i18n*/try{if((localStorage.getItem("lang")||"en")!=="ar"){var h=document.documentElement;h.classList.add("i18n-pending");h.lang="en";h.dir="ltr";setTimeout(function(){h.classList.remove("i18n-pending")},2500)}}catch(e){}</script><style>.i18n-pending body{visibility:hidden}</style><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>💰 متتبّع المصروفات</title><style>*{box-sizing:border-box;margin:0}
:root{--a:#4f46e5;--bg:#f1f5f9;--card:#fff;--ink:#0f172a;--mut:#64748b;--line:#e2e8f0}
body{font-family:system-ui,'Segoe UI',Tahoma,Arial,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;display:grid;place-items:start center;padding:24px 14px;line-height:1.6}
.app{background:var(--card);border-radius:18px;box-shadow:0 10px 40px rgba(15,23,42,.1);width:min(480px,100%);padding:22px}
h1{font-size:1.4rem;margin-bottom:14px;text-align:center}
input,select,textarea,button{font:inherit}
input,select,textarea{border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;background:#fff;color:var(--ink)}
input:focus,select:focus,textarea:focus{outline:2px solid var(--a);border-color:transparent}
button{border:0;border-radius:10px;padding:10px 16px;background:var(--a);color:#fff;font-weight:700;cursor:pointer}
button:hover{filter:brightness(.92)}button.g{background:#e2e8f0;color:var(--ink)}button.d{background:#ef4444}
.row{display:flex;gap:8px;margin-bottom:10px}.mut{color:var(--mut);font-size:.9rem}
.big{font-size:2.4rem;font-weight:800;text-align:center}.sum{display:grid;grid-template-columns:1fr 1fr;text-align:center;margin:10px 0 16px;background:var(--bg);border-radius:12px;padding:10px}.sum b{display:block;font-size:1.2rem}
ul{list-style:none;padding:0;margin-top:14px}li{display:flex;gap:10px;align-items:center;padding:8px 10px;border-radius:10px;margin-bottom:6px;border-inline-start:4px solid}li span{flex:1}li.inc{border-color:#16a34a;background:#f0fdf4}li.exp{border-color:#dc2626;background:#fef2f2}li button{padding:2px 8px}</style></head>
<body><div class="app"><h1>💰 متتبّع المصروفات</h1>
<div id="bal" class="big">0</div>
<div class="sum"><div>الدخل<b id="inc" style="color:#16a34a">0</b></div><div>المصروف<b id="exp" style="color:#dc2626">0</b></div></div>
<form id="f"><input id="d" placeholder="الوصف" required><div class="row" style="margin:8px 0"><input id="a" type="number" step="0.01" min="0" placeholder="المبلغ" required>
<select id="k"><option value="inc">دخل</option><option value="exp" selected>مصروف</option></select></div><button style="width:100%">إضافة</button></form>
<ul id="l"></ul>
</div><script>

let rec=[];try{rec=JSON.parse(localStorage.getItem('exp')||'[]')}catch{}
const $=i=>document.getElementById(i),n=v=>v.toLocaleString('ar-SA',{maximumFractionDigits:2});
const save=()=>{try{localStorage.setItem('exp',JSON.stringify(rec))}catch{}};
function draw(){const inc=rec.filter(r=>r.k==='inc').reduce((s,r)=>s+r.a,0),exp=rec.filter(r=>r.k==='exp').reduce((s,r)=>s+r.a,0);
 $('inc').textContent=n(inc);$('exp').textContent=n(exp);$('bal').textContent=n(inc-exp)+' ر.س';
 $('l').innerHTML=[...rec].reverse().map(r=>`<li class="${r.k}"><span>${r.d.replace(/</g,'&lt;')}</span><b>${r.k==='inc'?'+':'−'}${n(r.a)}</b><button class="g" data-r="${r.id}">✕</button></li>`).join('')}
$('f').onsubmit=e=>{e.preventDefault();rec.push({id:Date.now(),d:$('d').value.trim(),a:+$('a').value,k:$('k').value});save();e.target.reset();draw()};
$('l').onclick=e=>{if(e.target.dataset.r){rec=rec.filter(r=>r.id!=e.target.dataset.r);save();draw()}};draw();
</script><script src="../i18n.js"></script></body></html>
