<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head><script>/*i18n*/try{if((localStorage.getItem("lang")||"en")!=="ar"){var h=document.documentElement;h.classList.add("i18n-pending");h.lang="en";h.dir="ltr";setTimeout(function(){h.classList.remove("i18n-pending")},2500)}}catch(e){}</script><style>.i18n-pending body{visibility:hidden}</style><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>🍅 مؤقّت بومودورو</title><style>*{box-sizing:border-box;margin:0}
:root{--a:#4f46e5;--bg:#f1f5f9;--card:#fff;--ink:#0f172a;--mut:#64748b;--line:#e2e8f0}
body{font-family:system-ui,'Segoe UI',Tahoma,Arial,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;display:grid;place-items:start center;padding:24px 14px;line-height:1.6}
.app{background:var(--card);border-radius:18px;box-shadow:0 10px 40px rgba(15,23,42,.1);width:min(480px,100%);padding:22px}
h1{font-size:1.4rem;margin-bottom:14px;text-align:center}
input,select,textarea,button{font:inherit}
input,select,textarea{border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;background:#fff;color:var(--ink)}
input:focus,select:focus,textarea:focus{outline:2px solid var(--a);border-color:transparent}
button{border:0;border-radius:10px;padding:10px 16px;background:var(--a);color:#fff;font-weight:700;cursor:pointer}
button:hover{filter:brightness(.92)}button.g{background:#e2e8f0;color:var(--ink)}button.d{background:#ef4444}
.row{display:flex;gap:8px;margin-bottom:10px}.mut{color:var(--mut);font-size:.9rem}
#t{font-size:4.5rem;font-weight:800;text-align:center;direction:ltr;margin:6px 0 14px;color:#dc2626}</style></head>
<body><div class="app"><h1>🍅 مؤقّت بومودورو</h1>
<div id="mode" class="mut" style="text-align:center">وقت التركيز</div><div id="t">25:00</div>
<div class="row"><button id="s" style="flex:1">ابدأ</button><button class="g" id="r">إعادة</button></div>
<div class="row"><button class="g" data-m="25" style="flex:1">تركيز 25</button><button class="g" data-m="5" style="flex:1">راحة 5</button><button class="g" data-m="15" style="flex:1">راحة 15</button></div>
<p class="mut" style="text-align:center" id="c">جلسات مكتملة اليوم: 0</p>
</div><script>

const $=i=>document.getElementById(i);let total=25*60,left=total,timer=null,done=0,focus=true;
const show=()=>{const m=String(Math.floor(left/60)).padStart(2,'0'),s=String(left%60).padStart(2,'0');$('t').textContent=m+':'+s;document.title=m+':'+s+' • بومودورو'};
function stop(){clearInterval(timer);timer=null;$('s').textContent='ابدأ'}
function tick(){left--;if(left<=0){left=0;stop();if(focus){done++;$('c').textContent='جلسات مكتملة اليوم: '+done}try{new AudioContext().resume()}catch{}alert(focus?'انتهى وقت التركيز! خذ استراحة.':'انتهت الراحة!')}show()}
$('s').onclick=()=>{if(timer){stop()}else{timer=setInterval(tick,1000);$('s').textContent='إيقاف مؤقت'}};
$('r').onclick=()=>{stop();left=total;show()};
document.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{stop();total=left=+b.dataset.m*60;focus=b.dataset.m==='25';$('mode').textContent=focus?'وقت التركيز':'وقت الراحة';show()});
show();
</script><script src="../i18n.js"></script></body></html>
