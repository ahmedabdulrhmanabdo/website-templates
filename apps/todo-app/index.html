<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head><script>/*i18n*/try{if((localStorage.getItem("lang")||"en")!=="ar"){var h=document.documentElement;h.classList.add("i18n-pending");h.lang="en";h.dir="ltr";setTimeout(function(){h.classList.remove("i18n-pending")},2500)}}catch(e){}</script><style>.i18n-pending body{visibility:hidden}</style><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>✅ قائمة المهام</title><style>*{box-sizing:border-box;margin:0}
:root{--a:#4f46e5;--bg:#f1f5f9;--card:#fff;--ink:#0f172a;--mut:#64748b;--line:#e2e8f0}
body{font-family:system-ui,'Segoe UI',Tahoma,Arial,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;display:grid;place-items:start center;padding:24px 14px;line-height:1.6}
.app{background:var(--card);border-radius:18px;box-shadow:0 10px 40px rgba(15,23,42,.1);width:min(480px,100%);padding:22px}
h1{font-size:1.4rem;margin-bottom:14px;text-align:center}
input,select,textarea,button{font:inherit}
input,select,textarea{border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;background:#fff;color:var(--ink)}
input:focus,select:focus,textarea:focus{outline:2px solid var(--a);border-color:transparent}
button{border:0;border-radius:10px;padding:10px 16px;background:var(--a);color:#fff;font-weight:700;cursor:pointer}
button:hover{filter:brightness(.92)}button.g{background:#e2e8f0;color:var(--ink)}button.d{background:#ef4444}
.row{display:flex;gap:8px;margin-bottom:10px}.mut{color:var(--mut);font-size:.9rem}
ul{list-style:none;padding:0}li{display:flex;align-items:center;gap:10px;padding:8px 4px;border-bottom:1px solid var(--line)}
li span{flex:1}li.done span{text-decoration:line-through;color:var(--mut)}li input{width:auto}li button{padding:2px 10px}#n{margin-top:12px;text-align:center}</style></head>
<body><div class="app"><h1>✅ قائمة المهام</h1>
<form class="row" id="f"><input id="t" placeholder="أضف مهمة جديدة…" required><button>إضافة</button></form>
<div class="row" id="flt"><button class="g" data-f="all">الكل</button><button class="g" data-f="open">المتبقية</button><button class="g" data-f="done">المنجزة</button></div>
<ul id="l"></ul><p class="mut" id="n"></p>
</div><script>

let tasks=[];try{tasks=JSON.parse(localStorage.getItem('todo')||'[]')}catch{}
let flt='all';const $=i=>document.getElementById(i);
const save=()=>{try{localStorage.setItem('todo',JSON.stringify(tasks))}catch{}};
function draw(){
 const L=tasks.filter(t=>flt==='all'||(flt==='done')===t.d);
 $('l').innerHTML=L.map(t=>`<li class="${t.d?'done':''}"><input type="checkbox" ${t.d?'checked':''} data-i="${t.id}"><span>${t.x.replace(/</g,'&lt;')}</span><button class="d" data-r="${t.id}">✕</button></li>`).join('')||'<p class="mut" style="text-align:center">لا توجد مهام</p>';
 $('n').textContent=`المتبقي: ${tasks.filter(t=>!t.d).length} من ${tasks.length}`;
 document.querySelectorAll('#flt button').forEach(b=>b.style.outline=b.dataset.f===flt?'2px solid var(--a)':'');
}
$('f').onsubmit=e=>{e.preventDefault();const v=$('t').value.trim();if(!v)return;tasks.push({id:Date.now(),x:v,d:false});$('t').value='';save();draw()};
$('l').onclick=e=>{const i=e.target.dataset.i,r=e.target.dataset.r;
 if(i){const t=tasks.find(x=>x.id==i);t.d=!t.d}if(r)tasks=tasks.filter(x=>x.id!=r);save();draw()};
$('flt').onclick=e=>{if(e.target.dataset.f){flt=e.target.dataset.f;draw()}};
draw();
</script><script src="../i18n.js"></script></body></html>
