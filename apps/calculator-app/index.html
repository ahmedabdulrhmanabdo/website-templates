<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>🧮 الآلة الحاسبة</title><style>*{box-sizing:border-box;margin:0}
:root{--a:#4f46e5;--bg:#f1f5f9;--card:#fff;--ink:#0f172a;--mut:#64748b;--line:#e2e8f0}
body{font-family:system-ui,'Segoe UI',Tahoma,Arial,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;display:grid;place-items:start center;padding:24px 14px;line-height:1.6}
.app{background:var(--card);border-radius:18px;box-shadow:0 10px 40px rgba(15,23,42,.1);width:min(480px,100%);padding:22px}
h1{font-size:1.4rem;margin-bottom:14px;text-align:center}
input,select,textarea,button{font:inherit}
input,select,textarea{border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;background:#fff;color:var(--ink)}
input:focus,select:focus,textarea:focus{outline:2px solid var(--a);border-color:transparent}
button{border:0;border-radius:10px;padding:10px 16px;background:var(--a);color:#fff;font-weight:700;cursor:pointer}
button:hover{filter:brightness(.92)}button.g{background:#e2e8f0;color:var(--ink)}button.d{background:#ef4444}
.row{display:flex;gap:8px;margin-bottom:10px}.mut{color:var(--mut);font-size:.9rem}
#scr{background:#0f172a;color:#fff;border-radius:12px;font-size:2.2rem;text-align:left;direction:ltr;padding:16px;margin-bottom:12px;overflow:auto}
#pad{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;direction:ltr}#pad button{padding:16px;font-size:1.2rem}#pad .o{background:#4f46e5}.z{grid-column:span 2}</style></head>
<body><div class="app"><h1>🧮 الآلة الحاسبة</h1>
<div id="scr">0</div><div id="pad"></div>
</div><script>

const keys=['C','⌫','%','÷','7','8','9','×','4','5','6','−','1','2','3','+','0','.','='];
let cur='0',prev=null,op=null,fresh=false;const scr=document.getElementById('scr'),pad=document.getElementById('pad');
pad.innerHTML=keys.map(k=>`<button class="${'÷×−+='.includes(k)?'o':'g'}${k==='0'?' z':''}" data-k="${k}">${k}</button>`).join('');
const fmt=n=>String(+parseFloat(n).toFixed(10));
function calc(a,b,o){a=+a;b=+b;return o==='+'?a+b:o==='−'?a-b:o==='×'?a*b:b===0?NaN:a/b}
function press(k){
 if(/\d/.test(k)){cur=(cur==='0'||fresh)?k:cur+k;fresh=false}
 else if(k==='.'){if(fresh){cur='0.';fresh=false}else if(!cur.includes('.'))cur+='.'}
 else if(k==='C'){cur='0';prev=op=null}
 else if(k==='⌫'){cur=cur.length>1?cur.slice(0,-1):'0'}
 else if(k==='%'){cur=fmt(cur/100)}
 else if(k==='='){if(op&&prev!==null){const r=calc(prev,cur,op);cur=isNaN(r)?'خطأ':fmt(r);prev=op=null;fresh=true}}
 else{if(op&&!fresh&&prev!==null){const r=calc(prev,cur,op);cur=isNaN(r)?'خطأ':fmt(r)}prev=cur;op=k;fresh=true}
 scr.textContent=cur;}
pad.onclick=e=>{if(e.target.dataset.k)press(e.target.dataset.k)};
document.onkeydown=e=>{const m={'*':'×','/':'÷','-':'−','Enter':'=','Backspace':'⌫','Escape':'C'};const k=m[e.key]||e.key;if(keys.includes(k))press(k)};
</script></body></html>
